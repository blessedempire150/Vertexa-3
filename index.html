<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERTEXA - Welcome</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:system-ui, -apple-system, sans-serif; background:#7C3AED; min-height:100vh; }
.wrap { width:100%; margin:0 auto; min-height:100vh; background:#7C3AED; display:flex; flex-direction:column; }
.hero { width:100%; height:55vh; min-height:340px; background:#7C3AED; overflow:hidden; }
.hero img { width:100%; height:100%; object-fit:cover; object-position:center top; display:block; }

/* ONLY THIS WHITE CARD - COPY AM PUT */
.card { background:#fff; margin:-32px 0 0 0; padding:38px 22px 40px; border-radius:32px 32px 0 0; text-align:center; flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; position:relative; z-index:2; }
.card h1 { font-size:clamp(28px, 8vw, 34px); line-height:1.18; color:#14142B; font-weight:800; margin-bottom:18px; }
.card p { color:#6B6B7A; font-size:clamp(14px, 4vw, 15px); line-height:1.55; margin-bottom:28px; }
.btn { display:inline-block; background:#6A00FF; color:#fff; text-decoration:none; padding:16px 20px; width:78%; max-width:340px; font-size:16px; font-weight:700; }
.small { margin-top:16px; font-size:14px; color:#888; }
.small a { color:#6A00FF; font-weight:700; text-decoration:none; }
@media (min-width: 768px) {
  body { background:#EDE7F6; display:flex; align-items:center; justify-content:center; padding:20px; }
  .wrap { max-width:980px; min-height:auto; height:88vh; max-height:720px; flex-direction:row; border-radius:28px; overflow:hidden; }
  .hero { width:55%; height:100%; }
  .card { width:45%; margin:0; border-radius:0; padding:40px; }
  .card h1 { font-size:38px; }
}
</style></head>
<body>
<div class="wrap">
  <div class="hero"><img src="welcome.jpg" alt=""></div>

  <!-- COPY ONLY THIS WHITE CARD PUT - NO OTHER CARD -->
  <div class="card">
    <h1>Discover your next<br>skill<br>Learn anything<br>you want!</h1>
    <p>Discover the things you want to learn<br>and grow with them</p>
    <a href="join.html" class="btn">Get Started</a>
    <p class="small">Already get account? <a href="join.html">Login Here</a></p>
  </div>

</div>
</body></html>
